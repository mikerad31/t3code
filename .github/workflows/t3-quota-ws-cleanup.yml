name: T3 quota ws cleanup

on:
  push:
    branches: [feat/codex-quota-dashboard]
    paths: [.github/workflows/t3-quota-ws-cleanup.yml]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild ws from exact pre-reset source
        run: |
          git show 2512cddce1539144a46978728829ecfccd0d90a5:apps/server/src/ws.ts > apps/server/src/ws.ts
          python scripts/t3-quota-ws-cleanup.py
          git diff --check
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/server/src/ws.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: make reset RPC ws diff surgical"
          git push origin HEAD:feat/codex-quota-dashboard
