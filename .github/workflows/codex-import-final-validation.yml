name: Codex Import Final Validation

on:
  push:
    branches:
      - validation/codex-import-final-2fca4286
    paths:
      - .github/workflows/codex-import-final-validation.yml

permissions:
  contents: read

env:
  FROZEN_HEAD_SHA: a82f12a108a25cfa3628a6b2d89ae78f42159d6f
  BASE_SHA: ead4ce52a1624d9c55461f61524580978fc8b719

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout frozen feature head
        uses: actions/checkout@v6
        with:
          ref: a82f12a108a25cfa3628a6b2d89ae78f42159d6f
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - name: Reject repository-owned PR assets
        run: |
          files="$(git ls-files .github/pr-assets)"
          if test -n "$files"; then
            printf 'PR evidence must be uploaded to GitHub, not committed:\n%s\n' "$files" >&2
            exit 1
          fi
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron
      - name: Check
        run: vp check
      - name: Typecheck
        run: vpr typecheck
      - name: Build desktop pipeline
        run: vp run build:desktop
      - name: Verify preload bundle output
        run: |
          test -f apps/desktop/dist-electron/preload.cjs
          grep -nE "desktopBridge|getLocalEnvironmentBootstrap|PICK_FOLDER_CHANNEL|wsUrl" apps/desktop/dist-electron/preload.cjs
          grep -n "__clerk_internal_electron_passkeys" apps/desktop/dist-electron/preload.cjs

  test:
    name: Test non-server workspace
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout frozen feature head
        uses: actions/checkout@v6
        with:
          ref: a82f12a108a25cfa3628a6b2d89ae78f42159d6f
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron
      - name: Test
        run: vp run --parallel --concurrency-limit 4 --filter '!t3' --filter '!@t3tools/monorepo' test

  test_server:
    name: Test Server ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout frozen feature head
        uses: actions/checkout@v6
        with:
          ref: a82f12a108a25cfa3628a6b2d89ae78f42159d6f
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - name: Test
        env:
          T3CODE_TRANSFER_BUDGET_REPORT_PATH: ${{ runner.temp }}/t3code-transfer-budget.md
          T3CODE_TRANSFER_BUDGET_RESULT_PATH: ${{ runner.temp }}/thread-transfer-result.json
        run: vp run --filter t3 test --shard ${{ matrix.shard }}/3

  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout frozen feature head
        uses: actions/checkout@v6
        with:
          ref: a82f12a108a25cfa3628a6b2d89ae78f42159d6f
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check resource monitor formatting
        run: cargo fmt --manifest-path native/resource-monitor/Cargo.toml -- --check
      - name: Test resource monitor
        run: cargo test --locked --manifest-path native/resource-monitor/Cargo.toml

  release_smoke:
    name: Release Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout frozen feature head
        uses: actions/checkout@v6
        with:
          ref: a82f12a108a25cfa3628a6b2d89ae78f42159d6f
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...
      - name: Exercise release-only workflow steps
        run: node scripts/release-smoke.ts

  mobile_native_gate:
    name: Mobile Native Changes Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout frozen feature head
        uses: actions/checkout@v6
        with:
          ref: a82f12a108a25cfa3628a6b2d89ae78f42159d6f
          fetch-depth: 0
      - name: Verify upstream native static analysis would skip
        run: |
          paths="$(git diff --name-only "$BASE_SHA" "$FROZEN_HEAD_SHA")"
          pattern='^apps/mobile/.*\.(swift|kt|kts)$|^apps/mobile/(\.swiftlint\.yml|detekt\.yml|\.editorconfig|Brewfile)$|^scripts/mobile-native-static-check\.ts$|^package\.json$|^\.github/workflows/ci\.yml$'
          if grep -qE "$pattern" <<< "$paths"; then
            echo "Native source or lint configuration changed; upstream macOS static analysis would be required."
            grep -E "$pattern" <<< "$paths"
            exit 1
          fi
          echo "No native source or lint configuration changed; upstream static analysis would skip."

  mobile_fingerprint:
    name: Mobile Native Fingerprint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_VARIANT: production
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout frozen feature head
        uses: actions/checkout@v6
        with:
          ref: a82f12a108a25cfa3628a6b2d89ae78f42159d6f
          fetch-depth: 0
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/mobile...
      - name: Expose pnpm
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          vp_pnpm_bin="$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin"
          echo "$vp_pnpm_bin" >> "$GITHUB_PATH"
          "$vp_pnpm_bin/pnpm" --version
      - name: Fingerprint frozen head
        working-directory: apps/mobile
        run: |
          mkdir -p "$RUNNER_TEMP/fp/head" "$RUNNER_TEMP/fp/base"
          for platform in ios android; do
            npx expo-updates fingerprint:generate --platform "$platform" > "$RUNNER_TEMP/fp/head/$platform.json"
          done
      - name: Fingerprint base
        run: |
          git checkout --quiet "$BASE_SHA"
          pnpm install --filter=@t3tools/mobile...
          cd apps/mobile
          for platform in ios android; do
            npx expo-updates fingerprint:generate --platform "$platform" > "$RUNNER_TEMP/fp/base/$platform.json"
          done
      - name: Compare fingerprints
        run: |
          changed=""
          for platform in ios android; do
            head_hash="$(jq -r .hash "$RUNNER_TEMP/fp/head/$platform.json")"
            base_hash="$(jq -r .hash "$RUNNER_TEMP/fp/base/$platform.json")"
            echo "$platform base=$base_hash head=$head_hash"
            if [ "$head_hash" != "$base_hash" ]; then
              changed="$changed $platform"
            fi
          done
          if [ -n "$changed" ]; then
            echo "Native fingerprint changed for:${changed}"
          else
            echo "Native fingerprints unchanged for iOS and Android."
          fi
