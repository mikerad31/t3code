name: T3 importer backend wiring runner

on:
  push:
    branches: [feat/codex-thread-import]
    paths: [.github/workflows/t3-import-backend-runner.yml]

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Wire internal thread import orchestration
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          orchestration = "packages/contracts/src/orchestration.ts"
          thread_create = '''const ThreadCreateCommand = Schema.Struct({\n  type: Schema.Literal("thread.create"),\n  commandId: CommandId,\n  threadId: ThreadId,\n  projectId: ProjectId,\n  title: TrimmedNonEmptyString,\n  modelSelection: ModelSelection,\n  runtimeMode: RuntimeMode,\n  interactionMode: ProviderInteractionMode.pipe(\n    Schema.withDecodingDefault(Effect.succeed(DEFAULT_PROVIDER_INTERACTION_MODE)),\n  ),\n  branch: Schema.NullOr(TrimmedNonEmptyString),\n  worktreePath: Schema.NullOr(TrimmedNonEmptyString),\n  createdAt: IsoDateTime,\n});\n'''
          thread_import = thread_create + '''\n/** Server-internal atomic import of one historical provider conversation. */\nconst ThreadImportCommandMessage = Schema.Struct({\n  id: MessageId,\n  role: OrchestrationMessageRole,\n  text: Schema.String,\n  createdAt: IsoDateTime,\n});\n\nconst ThreadImportCommand = Schema.Struct({\n  type: Schema.Literal("thread.import"),\n  commandId: CommandId,\n  threadId: ThreadId,\n  projectId: ProjectId,\n  title: TrimmedNonEmptyString,\n  modelSelection: ModelSelection,\n  runtimeMode: RuntimeMode,\n  interactionMode: ProviderInteractionMode.pipe(\n    Schema.withDecodingDefault(Effect.succeed(DEFAULT_PROVIDER_INTERACTION_MODE)),\n  ),\n  messages: Schema.Array(ThreadImportCommandMessage),\n  createdAt: IsoDateTime,\n  updatedAt: IsoDateTime,\n});\n'''
          replace_once(orchestration, thread_create, thread_import, "thread import command schema")
          replace_once(
              orchestration,
              '''const InternalOrchestrationCommand = Schema.Union([\n  ThreadSessionSetCommand,''',
              '''const InternalOrchestrationCommand = Schema.Union([\n  ThreadImportCommand,\n  ThreadSessionSetCommand,''',
              "internal command union",
          )

          decider = "apps/server/src/orchestration/decider.ts"
          thread_create_case = '''    case "thread.create": {\n      yield* requireProject({\n        readModel,\n        command,\n        projectId: command.projectId,\n      });\n      yield* requireThreadAbsent({\n        readModel,\n        command,\n        threadId: command.threadId,\n      });\n      return {\n        ...(yield* withEventBase({\n          aggregateKind: "thread",\n          aggregateId: command.threadId,\n          occurredAt: command.createdAt,\n          commandId: command.commandId,\n        })),\n        type: "thread.created",\n        payload: {\n          threadId: command.threadId,\n          projectId: command.projectId,\n          title: command.title,\n          modelSelection: command.modelSelection,\n          runtimeMode: command.runtimeMode,\n          interactionMode: command.interactionMode,\n          branch: command.branch,\n          worktreePath: command.worktreePath,\n          createdAt: command.createdAt,\n          updatedAt: command.createdAt,\n        },\n      };\n    }\n'''
          import_case = '''\n    case "thread.import": {\n      yield* requireProject({\n        readModel,\n        command,\n        projectId: command.projectId,\n      });\n      yield* requireThreadAbsent({\n        readModel,\n        command,\n        threadId: command.threadId,\n      });\n\n      const createdEvent: PlannedOrchestrationEvent = {\n        ...(yield* withEventBase({\n          aggregateKind: "thread",\n          aggregateId: command.threadId,\n          occurredAt: command.createdAt,\n          commandId: command.commandId,\n        })),\n        type: "thread.created",\n        payload: {\n          threadId: command.threadId,\n          projectId: command.projectId,\n          title: command.title,\n          modelSelection: command.modelSelection,\n          runtimeMode: command.runtimeMode,\n          interactionMode: command.interactionMode,\n          branch: null,\n          worktreePath: null,\n          createdAt: command.createdAt,\n          updatedAt: command.createdAt,\n        },\n      };\n\n      const messageEvents: PlannedOrchestrationEvent[] = [];\n      for (const message of command.messages) {\n        messageEvents.push({\n          ...(yield* withEventBase({\n            aggregateKind: "thread",\n            aggregateId: command.threadId,\n            occurredAt: message.createdAt,\n            commandId: command.commandId,\n          })),\n          type: "thread.message-sent",\n          payload: {\n            threadId: command.threadId,\n            messageId: message.id,\n            role: message.role,\n            text: message.text,\n            turnId: null,\n            streaming: false,\n            createdAt: message.createdAt,\n            updatedAt: message.createdAt,\n          },\n        });\n      }\n\n      // Preserve the provider thread's own update timestamp even when its\n      // newest persisted activity is not represented by a chat message.\n      const timestampEvent: PlannedOrchestrationEvent = {\n        ...(yield* withEventBase({\n          aggregateKind: "thread",\n          aggregateId: command.threadId,\n          occurredAt: command.updatedAt,\n          commandId: command.commandId,\n        })),\n        type: "thread.meta-updated",\n        payload: {\n          threadId: command.threadId,\n          updatedAt: command.updatedAt,\n        },\n      };\n\n      return [createdEvent, ...messageEvents, timestampEvent];\n    }\n'''
          replace_once(decider, thread_create_case, thread_create_case + import_case, "thread import decider")

          service = "apps/server/src/threadImport/ThreadImportService.ts"
          replace_once(
              service,
              '''              messages,\n              createdAt: yield* nowIso,\n            });''',
              '''              messages,\n              createdAt: transcript.createdAt,\n              updatedAt: transcript.updatedAt,\n            });''',
              "preserve imported thread timestamps",
          )

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - name: Capture typecheck diagnostics
        run: vpr typecheck > .t3-import-backend-typecheck.txt 2>&1 || true
      - name: Commit backend slice and diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/contracts/src/orchestration.ts apps/server/src/orchestration/decider.ts apps/server/src/threadImport/ThreadImportService.ts .t3-import-backend-typecheck.txt
          git diff --cached --stat
          git commit -m "feat(import): persist historical Codex threads through orchestration"
          git push origin HEAD:feat/codex-thread-import
