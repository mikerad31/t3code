name: Validate native resume routing repair

on:
  push:
    branches:
      - validate/import-native-resume-routing-fix-v1

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.1
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply native-resume routing fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one replacement target, found {count}")
              p.write_text(text.replace(old, new))

          replace_once(
              "apps/web/src/components/ChatView.logic.ts",
              r'''  return {
            ...(modelSelectionChanged ? { modelSelection: nextModelSelection } : {}),
            ...(branchChanged ? { branch: input.nextBranch, worktreePath: null } : {}),
          };
          }

          export function buildLocalDraftThread(''',
              r'''  return {
            ...(modelSelectionChanged ? { modelSelection: nextModelSelection } : {}),
            ...(branchChanged ? { branch: input.nextBranch, worktreePath: null } : {}),
          };
          }

          /**
           * Imported provider conversations carry an exact provider-instance binding.
           * A deterministic imported thread id can also resurrect stale browser-local
           * composer state from an earlier import. Until the user explicitly changes
           * provider in the current interaction, treat the server thread's persisted
           * instance as canonical and ignore stale draft/session instance drift.
           */
          export function resolveImportedThreadProviderRouting(input: {
            threadId: ThreadId | null;
            persistedThreadInstanceId: ProviderInstanceId | null | undefined;
            draftActiveProvider: ProviderInstanceId | null | undefined;
            sessionProviderInstanceId: ProviderInstanceId | null | undefined;
            explicitlySelectedForThread: boolean;
          }): {
            draftActiveProvider: ProviderInstanceId | null;
            sessionProviderInstanceId: ProviderInstanceId | null;
          } {
            const draftActiveProvider = input.draftActiveProvider ?? null;
            const sessionProviderInstanceId = input.sessionProviderInstanceId ?? null;
            const persistedThreadInstanceId = input.persistedThreadInstanceId ?? null;
            const isImportedThread =
              input.threadId !== null && String(input.threadId).startsWith("imported:");

            if (
              !isImportedThread ||
              persistedThreadInstanceId === null ||
              input.explicitlySelectedForThread
            ) {
              return { draftActiveProvider, sessionProviderInstanceId };
            }

            return {
              draftActiveProvider:
                draftActiveProvider !== null && draftActiveProvider !== persistedThreadInstanceId
                  ? null
                  : draftActiveProvider,
              sessionProviderInstanceId:
                sessionProviderInstanceId !== null &&
                sessionProviderInstanceId !== persistedThreadInstanceId
                  ? null
                  : sessionProviderInstanceId,
            };
          }

          export function buildLocalDraftThread(''',
          )

          replace_once(
              "apps/web/src/components/ChatView.logic.test.ts",
              r'''  reconcileMountedTerminalThreadIds,
            reconcileRetainedMountedThreadIds,
            resolveBackgroundDraftWorkspaceOptions,
            resolveDraftPromotionNavigationTarget,
            resolveThreadMetadataUpdateForNextTurn,
            resolveSendEnvMode,''',
              r'''  reconcileMountedTerminalThreadIds,
            reconcileRetainedMountedThreadIds,
            resolveBackgroundDraftWorkspaceOptions,
            resolveDraftPromotionNavigationTarget,
            resolveImportedThreadProviderRouting,
            resolveThreadMetadataUpdateForNextTurn,
            resolveSendEnvMode,''',
          )

          replace_once(
              "apps/web/src/components/ChatView.logic.test.ts",
              r'''describe("buildThreadTurnInterruptInput", () => {''',
              r'''describe("resolveImportedThreadProviderRouting", () => {
            const importedThreadId = ThreadId.make("imported:resume-test");
            const sourceInstanceId = ProviderInstanceId.make("codex_a2");
            const staleInstanceId = ProviderInstanceId.make("codex");

            it("ignores stale draft and session instance drift for an imported thread", () => {
              expect(
                resolveImportedThreadProviderRouting({
                  threadId: importedThreadId,
                  persistedThreadInstanceId: sourceInstanceId,
                  draftActiveProvider: staleInstanceId,
                  sessionProviderInstanceId: staleInstanceId,
                  explicitlySelectedForThread: false,
                }),
              ).toEqual({
                draftActiveProvider: null,
                sessionProviderInstanceId: null,
              });
            });

            it("honors a provider change explicitly selected in the current interaction", () => {
              expect(
                resolveImportedThreadProviderRouting({
                  threadId: importedThreadId,
                  persistedThreadInstanceId: sourceInstanceId,
                  draftActiveProvider: staleInstanceId,
                  sessionProviderInstanceId: sourceInstanceId,
                  explicitlySelectedForThread: true,
                }),
              ).toEqual({
                draftActiveProvider: staleInstanceId,
                sessionProviderInstanceId: sourceInstanceId,
              });
            });

            it("leaves ordinary server-thread routing unchanged", () => {
              expect(
                resolveImportedThreadProviderRouting({
                  threadId,
                  persistedThreadInstanceId: sourceInstanceId,
                  draftActiveProvider: staleInstanceId,
                  sessionProviderInstanceId: staleInstanceId,
                  explicitlySelectedForThread: false,
                }),
              ).toEqual({
                draftActiveProvider: staleInstanceId,
                sessionProviderInstanceId: staleInstanceId,
              });
            });
          });

          describe("buildThreadTurnInterruptInput", () => {''',
          )

          replace_once(
              "apps/web/src/components/chat/ChatComposer.tsx",
              r'''import { deriveComposerSendState, readFileAsDataUrl } from "../ChatView.logic";''',
              r'''import {
            deriveComposerSendState,
            readFileAsDataUrl,
            resolveImportedThreadProviderRouting,
          } from "../ChatView.logic";''',
          )

          replace_once(
              "apps/web/src/components/chat/ChatComposer.tsx",
              r'''  const composerDraft = useComposerThreadDraft(composerDraftTarget);
            const prompt = composerDraft.prompt;''',
              r'''  const composerDraft = useComposerThreadDraft(composerDraftTarget);
            const providerSelectionTouchedThreadIdRef = useRef<ThreadId | null>(null);
            const prompt = composerDraft.prompt;''',
          )

          replace_once(
              "apps/web/src/components/chat/ChatComposer.tsx",
              r'''  const selectedProviderByThreadId = composerDraft.activeProvider ?? null;
            const threadProvider =
              activeThread?.session?.providerInstanceId ??
              activeThreadModelSelection?.instanceId ??
              activeProjectDefaultModelSelection?.instanceId ??
              null;''',
              r'''  const importedThreadProviderRouting = resolveImportedThreadProviderRouting({
            threadId: activeThreadId,
            persistedThreadInstanceId: activeThreadModelSelection?.instanceId,
            draftActiveProvider: composerDraft.activeProvider,
            sessionProviderInstanceId: activeThread?.session?.providerInstanceId,
            explicitlySelectedForThread:
              activeThreadId !== null &&
              providerSelectionTouchedThreadIdRef.current === activeThreadId,
          });
          const selectedProviderByThreadId = importedThreadProviderRouting.draftActiveProvider;
          const threadProvider =
            importedThreadProviderRouting.sessionProviderInstanceId ??
            activeThreadModelSelection?.instanceId ??
            activeProjectDefaultModelSelection?.instanceId ??
            null;''',
          )

          replace_once(
              "apps/web/src/components/chat/ChatComposer.tsx",
              r'''    const lockedInstanceId =
              activeThread.session?.providerInstanceId ?? activeThreadModelSelection?.instanceId;''',
              r'''    const lockedInstanceId =
              importedThreadProviderRouting.sessionProviderInstanceId ??
              activeThreadModelSelection?.instanceId;''',
          )

          replace_once(
              "apps/web/src/components/chat/ChatComposer.tsx",
              r'''    activeThread,
            activeThreadModelSelection?.instanceId,
            lockedProvider,
            providerInstanceEntries,
          ]);''',
              r'''    activeThread,
            activeThreadModelSelection?.instanceId,
            importedThreadProviderRouting.sessionProviderInstanceId,
            lockedProvider,
            providerInstanceEntries,
          ]);''',
          )

          replace_once(
              "apps/web/src/components/chat/ChatComposer.tsx",
              r'''    const candidates: Array<string | null | undefined> = [
              composerDraft.activeProvider,
              activeThread?.session?.providerInstanceId,
              activeThreadModelSelection?.instanceId,
              activeProjectDefaultModelSelection?.instanceId,
            ];''',
              r'''    const candidates: Array<string | null | undefined> = [
              importedThreadProviderRouting.draftActiveProvider,
              importedThreadProviderRouting.sessionProviderInstanceId,
              activeThreadModelSelection?.instanceId,
              activeProjectDefaultModelSelection?.instanceId,
            ];''',
          )

          replace_once(
              "apps/web/src/components/chat/ChatComposer.tsx",
              r'''    activeProjectDefaultModelSelection?.instanceId,
            activeThread?.session?.providerInstanceId,
            activeThreadModelSelection?.instanceId,
            composerDraft.activeProvider,
            lockedContinuationGroupKey,
            lockedProvider,
            providerInstanceEntries,
            requestedDriverKind,
          ]);''',
              r'''    activeProjectDefaultModelSelection?.instanceId,
            activeThreadModelSelection?.instanceId,
            importedThreadProviderRouting.draftActiveProvider,
            importedThreadProviderRouting.sessionProviderInstanceId,
            lockedContinuationGroupKey,
            lockedProvider,
            providerInstanceEntries,
            requestedDriverKind,
          ]);''',
          )

          replace_once(
              "apps/web/src/components/chat/ChatComposer.tsx",
              r'''  const selectedModelForPicker = selectedModel;
            // Instance-keyed option list so the picker can show each configured''',
              r'''  const handleProviderModelSelect = useCallback(
            (instanceId: ProviderInstanceId, model: string) => {
              providerSelectionTouchedThreadIdRef.current = activeThreadId;
              onProviderModelSelect(instanceId, model);
            },
            [activeThreadId, onProviderModelSelect],
          );
          const selectedModelForPicker = selectedModel;
          // Instance-keyed option list so the picker can show each configured''',
          )

          replace_once(
              "apps/web/src/components/chat/ChatComposer.tsx",
              r'''  useEffect(() => {
            setComposerHighlightedItemId(null);
            setComposerSubmissionError(null);''',
              r'''  useEffect(() => {
            providerSelectionTouchedThreadIdRef.current = null;
            setComposerHighlightedItemId(null);
            setComposerSubmissionError(null);''',
          )

          replace_once(
              "apps/web/src/components/chat/ChatComposer.tsx",
              r'''                      onInstanceModelChange={onProviderModelSelect}''',
              r'''                      onInstanceModelChange={handleProviderModelSelect}''',
          )

          replace_once(
              "apps/server/src/threadImport/ThreadImportService.ts",
              r'''        const modelSelection =
              existingThread !== undefined
                ? existingThread.modelSelection
                : modelSelectionFor(
                    source.instance.instanceId,
                    yield* source.instance.snapshot.getSnapshot,
                    project.defaultModelSelection,
                  );''',
              r'''        const existingModelSelection =
              existingThread?.modelSelection.instanceId === source.instance.instanceId
                ? existingThread.modelSelection
                : undefined;
            const modelSelection =
              existingModelSelection ??
              modelSelectionFor(
                source.instance.instanceId,
                yield* source.instance.snapshot.getSnapshot,
                project.defaultModelSelection,
              );''',
          )

          replace_once(
              "apps/server/src/threadImport/ThreadImportService.ts",
              r'''        let status: ThreadImportItemResult["status"] = materializedBeforeBinding
              ? "already-imported"
              : "imported";
            const bindingResult = yield* Effect.result(''',
              r'''        if (
              materializedBeforeBinding &&
              existingThread !== undefined &&
              existingThread.modelSelection.instanceId !== source.instance.instanceId
            ) {
              const repairTimestamp = yield* nowIso;
              const metadataRepairResult = yield* Effect.result(
                engine.dispatch({
                  type: "thread.meta.update",
                  commandId: CommandId.make(
                    `import-provider-repair:${stableHash(
                      `${String(candidateId)}\0${repairTimestamp}`,
                    ).slice(0, 40)}`,
                  ),
                  threadId,
                  modelSelection,
                }),
              );
              if (Result.isFailure(metadataRepairResult)) {
                results.push({
                  candidateId,
                  status: "transcript-only",
                  threadId,
                  importedMessageCount: 0,
                  warnings: [...transcript.warnings],
                  error:
                    "The transcript is already imported, but its Codex provider instance could not be restored.",
                });
                continue;
              }
              existingThread = { ...existingThread, modelSelection };
            }

            let status: ThreadImportItemResult["status"] = materializedBeforeBinding
              ? "already-imported"
              : "imported";
            const bindingResult = yield* Effect.result(''',
          )

          replace_once(
              "apps/server/src/threadImport/ThreadImportService.ts",
              r'''              modelSelection: existingThread?.modelSelection ?? modelSelection,''',
              r'''              modelSelection,''',
          )

          replace_once(
              "apps/server/src/threadImport/ThreadImportService.test.ts",
              r'''      if (command.type === "thread.import") {
                importedThread = {
                  id: command.threadId,
                  projectId: command.projectId,
                  modelSelection: command.modelSelection,
                  runtimeMode: command.runtimeMode,
                } as OrchestrationThreadShell;
              }
              return Effect.succeed({ sequence: commands.length });''',
              r'''      if (command.type === "thread.import") {
                importedThread = {
                  id: command.threadId,
                  projectId: command.projectId,
                  modelSelection: command.modelSelection,
                  runtimeMode: command.runtimeMode,
                } as OrchestrationThreadShell;
              } else if (
                command.type === "thread.meta.update" &&
                command.modelSelection !== undefined &&
                importedThread !== null
              ) {
                importedThread = { ...importedThread, modelSelection: command.modelSelection };
              }
              return Effect.succeed({ sequence: commands.length });''',
          )

          replace_once(
              "apps/server/src/threadImport/ThreadImportService.test.ts",
              r'''    commands,
            bindings,
          };
          }''',
              r'''    commands,
            bindings,
            setImportedModelSelection: (modelSelection: OrchestrationThreadShell["modelSelection"]) => {
              if (importedThread === null) throw new Error("expected an imported thread");
              importedThread = { ...importedThread, modelSelection };
            },
          };
          }''',
          )

          replace_once(
              "apps/server/src/threadImport/ThreadImportService.test.ts",
              r'''  it.effect("surfaces a total Codex scan failure instead of reporting empty history", () =>''',
              r'''  it.effect("repairs provider-instance drift before restoring native resume state", () =>
            Effect.gen(function* () {
              const harness = makeHarness({
                candidates: [sourceCandidate()],
                read: () => Effect.succeed(sourceTranscript()),
              });
              const initialScan = yield* harness.service.scan({ projectId });
              const candidateId = initialScan.candidates[0]!.candidateId;
              yield* harness.service.commit({
                projectId,
                candidateIds: [candidateId],
                runtimeMode: "full-access",
                interactionMode: "default",
              });

              const driftedInstanceId = ProviderInstanceId.make("codex");
              harness.setImportedModelSelection({
                instanceId: driftedInstanceId,
                model: "gpt-5.6-luna",
              });
              harness.bindings[0] = {
                ...harness.bindings[0]!,
                providerInstanceId: driftedInstanceId,
                resumeCursor: { threadId: "newly-started-thread" },
              };

              const repairScan = yield* harness.service.scan({ projectId });
              expect(repairScan.candidates[0]).toMatchObject({
                candidateId,
                alreadyImported: false,
                canResume: false,
              });

              const repairCommit = yield* harness.service.commit({
                projectId,
                candidateIds: [candidateId],
                runtimeMode: "full-access",
                interactionMode: "default",
              });
              expect(repairCommit.results[0]?.status).toBe("already-imported");
              expect(harness.commands.map((command) => command.type)).toEqual([
                "thread.import",
                "thread.meta.update",
              ]);
              const metadataRepair = harness.commands[1]!;
              expect(metadataRepair.type).toBe("thread.meta.update");
              if (metadataRepair.type !== "thread.meta.update") {
                throw new Error("expected thread.meta.update repair command");
              }
              expect(metadataRepair.modelSelection).toMatchObject({
                instanceId,
                model: "gpt-5.6-codex",
              });

              const repairedBinding = harness.bindings.at(-1);
              expect(repairedBinding).toMatchObject({
                providerInstanceId: instanceId,
                resumeCursor: sourceTranscript().resumeCursor,
                runtimePayload: {
                  modelSelection: {
                    instanceId,
                    model: "gpt-5.6-codex",
                  },
                },
              });

              const repairedScan = yield* harness.service.scan({ projectId });
              expect(repairedScan.candidates[0]).toMatchObject({
                candidateId,
                alreadyImported: true,
                canResume: true,
              });
            }),
          );

          it.effect("surfaces a total Codex scan failure instead of reporting empty history", () =>''',
          )
          PY

      - name: Format product files
        run: |
          pnpm exec vp fmt \
            apps/web/src/components/ChatView.logic.ts \
            apps/web/src/components/ChatView.logic.test.ts \
            apps/web/src/components/chat/ChatComposer.tsx \
            apps/server/src/threadImport/ThreadImportService.ts \
            apps/server/src/threadImport/ThreadImportService.test.ts

      - name: Assert exact product surface
        run: |
          cat > /tmp/expected-files.txt <<'EOF'
          apps/server/src/threadImport/ThreadImportService.test.ts
          apps/server/src/threadImport/ThreadImportService.ts
          apps/web/src/components/ChatView.logic.test.ts
          apps/web/src/components/ChatView.logic.ts
          apps/web/src/components/chat/ChatComposer.tsx
          EOF
          sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          git diff --name-only 37fb7d8d20b14922c6eab526a1180d808f71804b \
            | grep -v '^.github/workflows/tmp-import-native-resume-routing-fix-v1.yml$' \
            | sort > /tmp/actual-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt

      - name: Repository conformance
        run: pnpm exec vp check

      - name: Focused web regression
        run: pnpm --filter @t3tools/web exec vp test run src/components/ChatView.logic.test.ts

      - name: Focused importer regression
        run: pnpm --filter t3 exec vp test run src/threadImport/ThreadImportService.test.ts

      - name: Full web regression suite
        run: pnpm --filter @t3tools/web exec vp test run

      - name: Full server regression suite
        run: pnpm --filter t3 test

      - name: Full monorepo typecheck
        run: pnpm typecheck

      - name: Final diff sanity
        run: |
          git diff --check
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --name-only 37fb7d8d20b14922c6eab526a1180d808f71804b \
            | grep -v '^.github/workflows/tmp-import-native-resume-routing-fix-v1.yml$' \
            | sort > /tmp/actual-files-after.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files-after.txt

      - name: Stage validated product blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/import-native-resume-routing-fix-blobs
          : > /tmp/import-native-resume-routing-fix-blobs/manifest.txt
          while IFS= read -r file; do
            base64 -w0 "$file" > /tmp/blob-content.b64
            jq -n --rawfile content /tmp/blob-content.b64 \
              '{content: $content, encoding: "base64"}' > /tmp/blob-request.json
            sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/blobs" --method POST --input /tmp/blob-request.json --jq .sha)"
            printf '%s %s\n' "$sha" "$file" | tee -a /tmp/import-native-resume-routing-fix-blobs/manifest.txt
          done < /tmp/expected-files.txt

      - uses: actions/upload-artifact@v4
        with:
          name: import-native-resume-routing-fix-v1-blobs
          path: /tmp/import-native-resume-routing-fix-blobs/manifest.txt
          retention-days: 1
