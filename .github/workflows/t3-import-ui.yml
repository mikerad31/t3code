name: T3 importer UI integration

on:
  push:
    branches:
      - feat/codex-thread-import
    paths:
      - .github/workflows/t3-import-ui.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Apply guarded sidebar integration
        run: python .github/scripts/t3_import_ui.py
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - name: Web typecheck
        working-directory: apps/web
        run: vp run typecheck
      - name: Commit importer UI integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/Sidebar.tsx
          git commit -m "feat(import): expose conversation import from project menu"
          git push origin HEAD:feat/codex-thread-import
