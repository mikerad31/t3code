name: Codex Import Effect v4 Conformance

on:
  push:
    branches:
      - validation/codex-import-final-2fca4286
    paths:
      - .github/workflows/codex-import-conformance-v4.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout validation harness
        uses: actions/checkout@v6
        with:
          ref: validation/codex-import-final-2fca4286
          sparse-checkout: |
            .github/workflows/codex-import-format-fix.yml
          sparse-checkout-cone-mode: false
      - name: Preserve validated transformer
        run: cp .github/workflows/codex-import-format-fix.yml "$RUNNER_TEMP/codex-import-fixer.yml"
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/codex-thread-import
          clean: true
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - name: Reuse guarded transformer and apply Effect v4 failure assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import subprocess

          workflow = Path(os.environ["RUNNER_TEMP"]) / "codex-import-fixer.yml"
          source = workflow.read_text(encoding="utf-8")
          marker = "      - name: Apply guarded conformance patch\n        run: |\n"
          start = source.index(marker) + len(marker)
          end = source.index("      - name: Setup Vite+\n", start)
          block = source[start:end]
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in block.splitlines()
          )
          subprocess.run(["bash", "-e", "-c", script], check=True)

          path = Path("apps/server/src/threadImport/ThreadImportService.test.ts")
          text = path.read_text(encoding="utf-8")
          old = '''      const error = yield* harness.service.scan({ projectId }).pipe(
                  Effect.map(() => null),
                  Effect.catchAll((cause) => Effect.succeed(cause)),
                );'''
          if text.count(old) == 0:
              old = '''    const error = yield* harness.service.scan({ projectId }).pipe(
              Effect.map(() => null),
              Effect.catchAll((cause) => Effect.succeed(cause)),
            );'''
          new = '''    const error = yield* harness.service.scan({ projectId }).pipe(Effect.flip);'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Effect v4 failure assertion anchor count: {count}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - name: Format touched files
        run: >-
          vp fmt
          apps/server/src/provider/Layers/CodexThreadImport.ts
          apps/server/src/threadImport/ThreadImportService.test.ts
      - name: Guard patch scope
        run: |
          expected="$(printf '%s\n' \
            apps/server/src/provider/Layers/CodexThreadImport.ts \
            apps/server/src/threadImport/ThreadImportService.test.ts | sort)"
          changed="$(git diff --name-only | sort)"
          printf 'Expected:\n%s\nChanged:\n%s\n' "$expected" "$changed"
          test "$changed" = "$expected"
          git diff --check
      - name: Repository check
        run: vp check
      - name: Server typecheck
        working-directory: apps/server
        run: vp run typecheck
      - name: Importer service tests
        run: vp test run apps/server/src/threadImport/ThreadImportService.test.ts
      - name: Commit repo-conformance fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/server/src/provider/Layers/CodexThreadImport.ts apps/server/src/threadImport/ThreadImportService.test.ts
          git diff --cached --check
          git commit -m "fix(import): align importer with Effect runtime conventions"
          git push origin HEAD:feat/codex-thread-import
