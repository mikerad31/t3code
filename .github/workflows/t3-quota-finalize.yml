name: T3 quota finalize

on:
  push:
    branches: [feat/codex-quota-dashboard]
    paths: [.github/workflows/t3-quota-finalize.yml]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Fix repository diagnostics
        shell: python
        run: |
          from pathlib import Path

          test = Path("apps/web/src/components/sidebar/SidebarCodexLimitsPopover.logic.test.ts")
          text = test.read_text(encoding="utf-8")
          old = 'import { describe, expect, it } from "vitest";'
          new = 'import { describe, expect, it } from "vite-plus/test";'
          if text.count(old) != 1:
              raise RuntimeError(f"expected stale vitest import once, found {text.count(old)}")
          test.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          component = Path("apps/web/src/components/sidebar/SidebarCodexLimitsPopover.tsx")
          text = component.read_text(encoding="utf-8")
          import_anchor = 'import * as Option from "effect/Option";'
          import_replacement = 'import * as Effect from "effect/Effect";\nimport * as Option from "effect/Option";\nimport * as Random from "effect/Random";'
          if text.count(import_anchor) != 1:
              raise RuntimeError("Option import anchor mismatch")
          text = text.replace(import_anchor, import_replacement, 1)
          old_uuid = 'previousAttempt?.failed === true ? previousAttempt.idempotencyKey : crypto.randomUUID();'
          new_uuid = '''previousAttempt?.failed === true\n          ? previousAttempt.idempotencyKey\n          : `quota-reset:${Effect.runSync(Random.next).toString(36).slice(2)}`;'''
          if text.count(old_uuid) != 1:
              raise RuntimeError("crypto.randomUUID anchor mismatch")
          component.write_text(text.replace(old_uuid, new_uuid, 1), encoding="utf-8", newline="\n")

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - name: Focused tests
        run: |
          vp test run apps/server/src/provider/Layers/CodexRateLimits.test.ts apps/server/src/provider/consumeRateLimitResetCredit.test.ts
          vp test run apps/web/src/components/sidebar/SidebarCodexLimitsPopover.logic.test.ts
      - name: Capture typecheck
        run: vpr typecheck > .t3-quota-final-typecheck.txt 2>&1 || true
      - name: Commit fixes and diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/sidebar/SidebarCodexLimitsPopover.logic.test.ts apps/web/src/components/sidebar/SidebarCodexLimitsPopover.tsx .t3-quota-final-typecheck.txt
          git commit -m "fix(codex): satisfy quota UI repository diagnostics"
          git push origin HEAD:feat/codex-quota-dashboard
