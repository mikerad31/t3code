name: Validate Codex rollout import fallback

on:
  push:
    branches:
      - fix/codex-rollout-import-fallback

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Format product slice
        run: |
          vp fmt \
            apps/server/src/provider/Layers/CodexRolloutTranscript.test.ts \
            apps/server/src/provider/Layers/CodexRolloutTranscript.ts \
            apps/server/src/provider/Layers/CodexThreadImport.ts \
            --write

      - name: Exact product surface
        run: |
          mapfile -t files < <(git diff --name-only de480af8fa248640ea5ea61398c46163f14eacd2...HEAD | grep -v '^.github/workflows/validate-codex-rollout-import-fallback.yml$' | sort)
          mapfile -t working < <(git diff --name-only | sort)
          expected=(
            apps/server/src/provider/Layers/CodexRolloutTranscript.test.ts
            apps/server/src/provider/Layers/CodexRolloutTranscript.ts
            apps/server/src/provider/Layers/CodexThreadImport.ts
          )
          printf '%s\n' "${files[@]}"
          test "${#files[@]}" -eq "${#expected[@]}"
          diff -u <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${files[@]}")
          for path in "${working[@]}"; do
            case "$path" in
              apps/server/src/provider/Layers/CodexRolloutTranscript.test.ts|apps/server/src/provider/Layers/CodexRolloutTranscript.ts|apps/server/src/provider/Layers/CodexThreadImport.ts)
                ;;
              *)
                echo "Formatter changed unexpected path: $path" >&2
                exit 1
                ;;
            esac
          done

      - name: Repo conformance
        run: vp check

      - name: Focused rollout fallback tests
        run: vp test run apps/server/src/provider/Layers/CodexRolloutTranscript.test.ts

      - name: Full server suite
        run: vp run --filter t3 test

      - name: Monorepo typecheck
        run: vpr typecheck

      - name: Diff sanity
        run: |
          git diff --check de480af8fa248640ea5ea61398c46163f14eacd2...HEAD
          git diff --check
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/validate-codex-rollout-import-fallback.yml|apps/server/src/provider/Layers/CodexRolloutTranscript.test.ts|apps/server/src/provider/Layers/CodexRolloutTranscript.ts|apps/server/src/provider/Layers/CodexThreadImport.ts)
                ;;
              *)
                echo "Unexpected changed path: $path" >&2
                exit 1
                ;;
            esac
          done < <(git diff --name-only de480af8fa248640ea5ea61398c46163f14eacd2...HEAD)
          while IFS= read -r path; do
            case "$path" in
              apps/server/src/provider/Layers/CodexRolloutTranscript.test.ts|apps/server/src/provider/Layers/CodexRolloutTranscript.ts|apps/server/src/provider/Layers/CodexThreadImport.ts)
                ;;
              *)
                echo "Unexpected working-tree path: $path" >&2
                exit 1
                ;;
            esac
          done < <(git diff --name-only)

      - name: Commit exact validated product tree
        run: |
          rm .github/workflows/validate-codex-rollout-import-fallback.yml
          git config user.name "T3 validation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          mapfile -t final < <(git diff --cached --name-only de480af8fa248640ea5ea61398c46163f14eacd2 | sort)
          expected=(
            apps/server/src/provider/Layers/CodexRolloutTranscript.test.ts
            apps/server/src/provider/Layers/CodexRolloutTranscript.ts
            apps/server/src/provider/Layers/CodexThreadImport.ts
          )
          printf '%s\n' "${final[@]}"
          test "${#final[@]}" -eq "${#expected[@]}"
          diff -u <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${final[@]}")
          git commit -m "fix(import): fall back to persisted Codex rollout history"
          git push origin HEAD:fix/codex-rollout-import-fallback
