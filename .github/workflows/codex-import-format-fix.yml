name: Codex Import Format Fix

on:
  push:
    branches:
      - validation/codex-import-final-2fca4286
    paths:
      - .github/workflows/codex-import-format-fix.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/codex-thread-import
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - name: Apply repository formatter
        run: vp check --fix
      - name: Guard formatter scope
        run: |
          expected="apps/server/src/provider/Layers/CodexThreadImport.ts"
          changed="$(git diff --name-only)"
          printf 'Formatter changed:\n%s\n' "$changed"
          test "$changed" = "$expected"
          git diff --check
      - name: Commit formatting fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/server/src/provider/Layers/CodexThreadImport.ts
          git commit -m "style(import): format Codex thread importer"
          git push origin HEAD:feat/codex-thread-import
