name: Codex Import Repo Conformance Fix

on:
  push:
    branches:
      - validation/codex-import-final-2fca4286
    paths:
      - .github/workflows/codex-import-format-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/codex-thread-import
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - name: Apply guarded conformance patch
        run: |
          python - <<'PY'
          from pathlib import Path

          codex_path = Path("apps/server/src/provider/Layers/CodexThreadImport.ts")
          codex = codex_path.read_text(encoding="utf-8")

          replacements = [
              (
                  'import type { CodexSettings } from "@t3tools/contracts";\n',
                  'import type { CodexSettings } from "@t3tools/contracts";\nimport { HostProcessPlatform, HostProcessWorkingDirectory } from "@t3tools/shared/hostProcess";\n',
              ),
              (
                  'function normalizePath(path: string): string {\n  const resolved = NodePath.normalize(NodePath.resolve(path));\n  return process.platform === "win32" ? resolved.toLowerCase() : resolved;\n}',
                  'function normalizePath(path: string, platform: NodeJS.Platform): string {\n  const resolved = NodePath.normalize(NodePath.resolve(path));\n  return platform === "win32" ? resolved.toLowerCase() : resolved;\n}',
              ),
              (
                  '    Effect.gen(function* () {\n      const spawnCommand = yield* resolveSpawnCommand(',
                  '    Effect.gen(function* () {\n      const workingDirectory = yield* HostProcessWorkingDirectory;\n      const spawnCommand = yield* resolveSpawnCommand(',
              ),
              (
                  '          cwd: process.cwd(),',
                  '          cwd: workingDirectory,',
              ),
              (
                  '''              Effect.flatMap((response) => {\n                if (normalizePath(String(response.thread.cwd)) !== normalizePath(projectRoot)) {\n                  return Effect.fail(\n                    new ProviderThreadImportError({\n                      operation: "read",\n                      detail: `Codex thread '${externalThreadId}' no longer belongs to '${projectRoot}'.`,\n                    }),\n                  );\n                }\n                return Effect.succeed(extractTranscript(response.thread, archived));\n              }),''',
                  '''              Effect.flatMap((response) =>\n                Effect.flatMap(HostProcessPlatform, (platform) => {\n                  if (\n                    normalizePath(String(response.thread.cwd), platform) !==\n                    normalizePath(projectRoot, platform)\n                  ) {\n                    return Effect.fail(\n                      new ProviderThreadImportError({\n                        operation: "read",\n                        detail: `Codex thread '${externalThreadId}' no longer belongs to '${projectRoot}'.`,\n                      }),\n                    );\n                  }\n                  return Effect.succeed(extractTranscript(response.thread, archived));\n                }),\n              ),''',
              ),
          ]
          for old, new in replacements:
              count = codex.count(old)
              if count != 1:
                  raise SystemExit(f"Codex conformance anchor count {count}: {old[:80]!r}")
              codex = codex.replace(old, new, 1)
          codex_path.write_text(codex, encoding="utf-8")

          test_path = Path("apps/server/src/threadImport/ThreadImportService.test.ts")
          test = test_path.read_text(encoding="utf-8")
          old_import = 'import { describe, expect, it } from "vite-plus/test";'
          if test.count(old_import) != 1:
              raise SystemExit(f"Effect test import anchor count: {test.count(old_import)}")
          test = test.replace(
              old_import,
              'import { it } from "@effect/vitest";\nimport { describe, expect } from "vite-plus/test";',
              1,
          )
          marker = 'describe("ThreadImportService", () => {'
          if test.count(marker) != 1:
              raise SystemExit(f"ThreadImportService describe anchor count: {test.count(marker)}")
          prefix = test.split(marker, 1)[0]
          tail = r'''describe("ThreadImportService", () => {
            it.effect(
              "preserves historical timestamps, saves resume state, and is deterministic/idempotent",
              () =>
                Effect.gen(function* () {
                  const transcript = sourceTranscript();
                  const harness = makeHarness({
                    candidates: [sourceCandidate()],
                    read: () => Effect.succeed(transcript),
                  });

                  const firstScan = yield* harness.service.scan({ projectId });
                  const secondScan = yield* harness.service.scan({ projectId });
                  expect(firstScan.candidates).toHaveLength(1);
                  expect(secondScan.candidates[0]?.candidateId).toBe(
                    firstScan.candidates[0]?.candidateId,
                  );

                  const candidateId = firstScan.candidates[0]!.candidateId;
                  const firstCommit = yield* harness.service.commit({
                    projectId,
                    candidateIds: [candidateId],
                    runtimeMode: "full-access",
                    interactionMode: "default",
                  });

                  expect(firstCommit.results[0]).toMatchObject({
                    candidateId,
                    status: "imported",
                    importedMessageCount: 2,
                  });
                  expect(harness.commands).toHaveLength(1);
                  const command = harness.commands[0]!;
                  expect(command.type).toBe("thread.import");
                  if (command.type !== "thread.import") throw new Error("expected thread.import command");
                  expect(command.createdAt).toBe(transcript.createdAt);
                  expect(command.updatedAt).toBe(transcript.updatedAt);
                  expect(command.messages.map((message) => message.createdAt)).toEqual(
                    transcript.messages.map((message) => message.createdAt),
                  );
                  expect(harness.bindings).toHaveLength(1);
                  expect(harness.bindings[0]).toMatchObject({
                    threadId: command.threadId,
                    provider: driverKind,
                    providerInstanceId: instanceId,
                    status: "stopped",
                    resumeCursor: transcript.resumeCursor,
                    runtimeMode: "full-access",
                    runtimePayload: {
                      cwd: project.workspaceRoot,
                    },
                  });

                  const postImportScan = yield* harness.service.scan({ projectId });
                  expect(postImportScan.candidates[0]?.alreadyImported).toBe(true);

                  const secondCommit = yield* harness.service.commit({
                    projectId,
                    candidateIds: [candidateId],
                    runtimeMode: "full-access",
                    interactionMode: "default",
                  });
                  expect(secondCommit.results[0]?.status).toBe("already-imported");
                  expect(harness.commands).toHaveLength(1);
                  expect(harness.bindings).toHaveLength(1);
                }),
            );

            it.effect("keeps the imported transcript when native resume binding cannot be persisted", () =>
              Effect.gen(function* () {
                const harness = makeHarness({
                  candidates: [sourceCandidate()],
                  read: () => Effect.succeed(sourceTranscript()),
                  sessionUpsert: () =>
                    Effect.fail(
                      new ProviderValidationError({
                        operation: "thread-import-resume-binding",
                        issue: "simulated persistence rejection",
                      }),
                    ),
                });
                const scan = yield* harness.service.scan({ projectId });
                const result = yield* harness.service.commit({
                  projectId,
                  candidateIds: [scan.candidates[0]!.candidateId],
                  runtimeMode: "full-access",
                  interactionMode: "default",
                });

                expect(result.results[0]?.status).toBe("transcript-only");
                expect(result.results[0]?.warnings.join(" ")).toContain(
                  "resume state could not be saved",
                );
                expect(harness.commands).toHaveLength(1);
              }),
            );

            it.effect("repairs missing native resume state on retry without duplicating the transcript", () =>
              Effect.gen(function* () {
                let rejectBinding = true;
                const harness = makeHarness({
                  candidates: [sourceCandidate()],
                  read: () => Effect.succeed(sourceTranscript()),
                  sessionUpsert: () =>
                    rejectBinding
                      ? Effect.fail(
                          new ProviderValidationError({
                            operation: "thread-import-resume-binding",
                            issue: "simulated persistence rejection",
                          }),
                        )
                      : Effect.void,
                });

                const initialScan = yield* harness.service.scan({ projectId });
                const candidateId = initialScan.candidates[0]!.candidateId;
                const firstCommit = yield* harness.service.commit({
                  projectId,
                  candidateIds: [candidateId],
                  runtimeMode: "full-access",
                  interactionMode: "default",
                });
                expect(firstCommit.results[0]?.status).toBe("transcript-only");
                expect(harness.commands).toHaveLength(1);
                expect(harness.bindings).toHaveLength(0);

                const repairScan = yield* harness.service.scan({ projectId });
                expect(repairScan.candidates[0]).toMatchObject({
                  candidateId,
                  alreadyImported: false,
                  canResume: false,
                });
                expect(repairScan.candidates[0]?.warnings.join(" ")).toContain("needs repair");

                rejectBinding = false;
                const repairCommit = yield* harness.service.commit({
                  projectId,
                  candidateIds: [candidateId],
                  runtimeMode: "full-access",
                  interactionMode: "default",
                });
                expect(repairCommit.results[0]?.status).toBe("already-imported");
                expect(repairCommit.results[0]?.importedMessageCount).toBe(0);
                expect(repairCommit.results[0]?.warnings.join(" ")).toContain("was restored");
                expect(harness.commands).toHaveLength(1);
                expect(harness.bindings).toHaveLength(1);

                const repairedScan = yield* harness.service.scan({ projectId });
                expect(repairedScan.candidates[0]).toMatchObject({
                  candidateId,
                  alreadyImported: true,
                  canResume: true,
                });
              }),
            );

            it.effect("surfaces a total Codex scan failure instead of reporting empty history", () =>
              Effect.gen(function* () {
                const harness = makeHarness({
                  candidates: [],
                  scan: () =>
                    Effect.fail(
                      new ProviderThreadImportError({
                        operation: "scan",
                        detail: "simulated Codex history scan failure",
                      }),
                    ),
                  read: () => Effect.succeed(sourceTranscript()),
                });

                const error = yield* harness.service.scan({ projectId }).pipe(
                  Effect.map(() => null),
                  Effect.catchAll((cause) => Effect.succeed(cause)),
                );
                expect(error).toMatchObject({
                  code: "source-unavailable",
                  message: "simulated Codex history scan failure",
                });
              }),
            );

            it.effect(
              "isolates transcript read failures so another selected conversation can still import",
              () =>
                Effect.gen(function* () {
                  const unreadable = sourceCandidate({
                    externalThreadId: "codex-thread-broken",
                    title: "Unreadable conversation",
                    updatedAt: "2026-08-21T10:00:00.000Z",
                  });
                  const readable = sourceCandidate({
                    externalThreadId: "codex-thread-good",
                    title: "Readable conversation",
                    updatedAt: "2026-08-20T10:00:00.000Z",
                  });
                  const harness = makeHarness({
                    candidates: [unreadable, readable],
                    read: ({ externalThreadId }) =>
                      externalThreadId === unreadable.externalThreadId
                        ? Effect.fail(
                            new ProviderThreadImportError({
                              operation: "read",
                              detail: "simulated unreadable transcript",
                            }),
                          )
                        : Effect.succeed(
                            sourceTranscript({
                              externalThreadId: readable.externalThreadId,
                              title: readable.title,
                            }),
                          ),
                  });
                  const scan = yield* harness.service.scan({ projectId });
                  expect(scan.candidates).toHaveLength(2);

                  const result = yield* harness.service.commit({
                    projectId,
                    candidateIds: scan.candidates.map((candidate) => candidate.candidateId),
                    runtimeMode: "full-access",
                    interactionMode: "default",
                  });

                  expect(result.results.map((item) => item.status)).toEqual(["failed", "imported"]);
                  expect(result.results[0]?.error).toContain("simulated unreadable transcript");
                  expect(harness.commands).toHaveLength(1);
                }),
            );
          });
          '''
          test_path.write_text(prefix + tail, encoding="utf-8")
          PY
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - name: Format touched files
        run: >-
          vp fmt
          apps/server/src/provider/Layers/CodexThreadImport.ts
          apps/server/src/threadImport/ThreadImportService.test.ts
      - name: Guard patch scope
        run: |
          expected="$(printf '%s\n' \
            apps/server/src/provider/Layers/CodexThreadImport.ts \
            apps/server/src/threadImport/ThreadImportService.test.ts | sort)"
          changed="$(git diff --name-only | sort)"
          printf 'Expected:\n%s\nChanged:\n%s\n' "$expected" "$changed"
          test "$changed" = "$expected"
          git diff --check
      - name: Repository check
        run: vp check
      - name: Server typecheck
        working-directory: apps/server
        run: vp run typecheck
      - name: Importer service tests
        run: vp test run apps/server/src/threadImport/ThreadImportService.test.ts
      - name: Commit repo-conformance fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/server/src/provider/Layers/CodexThreadImport.ts apps/server/src/threadImport/ThreadImportService.test.ts
          git diff --cached --check
          git commit -m "fix(import): align importer with Effect runtime conventions"
          git push origin HEAD:feat/codex-thread-import
