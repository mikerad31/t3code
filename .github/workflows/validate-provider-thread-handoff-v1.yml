name: Validate provider thread handoff v1

on:
  push:
    branches:
      - validate/provider-thread-handoff-v1
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Repair validator patcher tail matchers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("scripts/patch-provider-thread-handoff-v1.py")
          text = p.read_text(encoding="utf-8")
          old_needle = "needle = '''      ).pipe(\\n"
          new_needle = "needle = '''      }).pipe(\\n"
          old_replacement = "replacement = '''      ).pipe(\\n"
          new_replacement = "replacement = '''      }).pipe(\\n"
          if text.count(old_needle) != 1 or text.count(old_replacement) != 1:
              raise SystemExit("expected startSession tail matcher literals not found exactly once")
          text = text.replace(old_needle, new_needle, 1)
          text = text.replace(old_replacement, new_replacement, 1)
          p.write_text(text, encoding="utf-8")
          PY

      - name: Apply guarded lifecycle patch
        run: python3 scripts/patch-provider-thread-handoff-v1.py

      - name: Use Effect v4 per-thread semaphore
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("apps/server/src/provider/Layers/ProviderService.ts")
          text = p.read_text(encoding="utf-8")
          import_needle = 'import * as Ref from "effect/Ref";\n'
          if text.count(import_needle) != 1:
              raise SystemExit("Ref import boundary drifted")
          text = text.replace(import_needle, import_needle + 'import * as Semaphore from "effect/Semaphore";\n', 1)
          old = '''  const threadHandoffLocks = new Map<string, Effect.Semaphore>();
  const getThreadHandoffLock = Effect.fn("getThreadHandoffLock")(function* (threadId: ThreadId) {
    const key = String(threadId);
    const existing = threadHandoffLocks.get(key);
    if (existing) return existing;

    const created = yield* Effect.makeSemaphore(1);
    // `makeSemaphore` may yield; if another fiber won the race, share its lock.
    const raced = threadHandoffLocks.get(key);
    if (raced) return raced;
    threadHandoffLocks.set(key, created);
    return created;
  });
  const withThreadHandoffLock = <A, E, R>(
    threadId: ThreadId,
    effect: Effect.Effect<A, E, R>,
  ): Effect.Effect<A, E, R> =>
    Effect.flatMap(getThreadHandoffLock(threadId), (lock) => lock.withPermits(1)(effect));
'''
          new = '''  const threadHandoffLocks = new Map<string, Semaphore.Semaphore>();
  const getThreadHandoffLock = (threadId: ThreadId): Semaphore.Semaphore => {
    const key = String(threadId);
    const existing = threadHandoffLocks.get(key);
    if (existing) return existing;

    // Construction is synchronous in Effect v4, so there is no creation race.
    const created = Semaphore.makeUnsafe(1);
    threadHandoffLocks.set(key, created);
    return created;
  };
  const withThreadHandoffLock = <A, E, R>(
    threadId: ThreadId,
    effect: Effect.Effect<A, E, R>,
  ): Effect.Effect<A, E, R> => getThreadHandoffLock(threadId).withPermit(effect);
'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one generated handoff lock block, found {text.count(old)}")
          p.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Format
        run: vp fmt

      - name: Exact product surface
        run: |
          git diff --name-only 7b3cf77b888cf35428848ab9a4647443ebf6c1ad -- \
            ':!.github/workflows/validate-provider-thread-handoff-v1.yml' \
            ':!scripts/patch-provider-thread-handoff-v1.py' | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          apps/server/src/orchestration/Layers/ProviderCommandReactor.ts
          apps/server/src/provider/Layers/ProviderService.ts
          apps/server/src/threadImport/ThreadImportService.ts
          apps/server/src/ws.ts
          EOF
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Repo conformance
        run: vp check

      - name: Focused provider service tests
        id: provider_service_tests
        run: |
          set +e
          (cd apps/server && vp test run src/provider/Layers/ProviderService.test.ts) > /tmp/provider-service-test.log 2>&1
          status=$?
          tail -n 300 /tmp/provider-service-test.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload provider service test log
        if: always() && steps.provider_service_tests.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: provider-service-test-log
          path: /tmp/provider-service-test.log
          if-no-files-found: error
          retention-days: 7

      - name: Gate provider service tests
        run: test "${{ steps.provider_service_tests.outputs.status }}" = "0"

      - name: Focused reactor tests
        run: |
          set +e
          (cd apps/server && vp test run src/orchestration/Layers/ProviderCommandReactor.test.ts) > /tmp/provider-reactor-test.log 2>&1
          status=$?
          tail -n 300 /tmp/provider-reactor-test.log
          exit $status

      - name: Focused importer tests
        run: |
          set +e
          (cd apps/server && vp test run src/threadImport/ThreadImportService.test.ts) > /tmp/thread-import-test.log 2>&1
          status=$?
          tail -n 300 /tmp/thread-import-test.log
          exit $status

      - name: Server typecheck
        run: vp run --filter t3 typecheck

      - name: Diff sanity
        run: |
          git diff --check
          ! git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- apps/server/src

      - name: Stage validated product blobs
        if: success()
        run: |
          mkdir -p /tmp/provider-handoff-v1
          while read -r path; do
            mkdir -p "/tmp/provider-handoff-v1/$(dirname "$path")"
            cp "$path" "/tmp/provider-handoff-v1/$path"
            printf '%s %s\n' "$(git hash-object "$path")" "$path"
          done < /tmp/expected.txt | tee /tmp/provider-handoff-v1/manifest.txt
          git diff --binary 7b3cf77b888cf35428848ab9a4647443ebf6c1ad -- $(cat /tmp/expected.txt) > /tmp/provider-handoff-v1/product.patch

      - name: Upload validated blobs
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: provider-thread-handoff-v1-blobs
          path: /tmp/provider-handoff-v1
          retention-days: 7
