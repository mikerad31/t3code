name: T3 quota surgical cleanup

on:
  push:
    branches: [feat/codex-quota-dashboard]
    paths: [.github/workflows/t3-quota-surgical-cleanup.yml]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Restore upstream files and reapply only quota/reset hunks
        shell: python
        run: |
          import subprocess
          from pathlib import Path

          subprocess.run(["git", "fetch", "origin", "main"], check=True)

          def main_file(path: str) -> str:
              return subprocess.check_output(["git", "show", f"origin/main:{path}"], text=True)

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          # ProviderDriver.ts: only the typed per-instance account action seam.
          path = "apps/server/src/provider/ProviderDriver.ts"
          text = main_file(path)
          text = replace_once(
              text,
              "  ProviderInstanceId,\n} from \"@t3tools/contracts\";",
              "  ProviderInstanceId,\n  ProviderRateLimitResetCreditOutcome,\n} from \"@t3tools/contracts\";",
              "ProviderDriver outcome import",
          )
          account_actions = '''export interface ProviderAccountActions {\n  /**\n   * Consume one earned/banked rate-limit reset for this exact provider\n   * instance. The implementation must use the instance's captured account\n   * environment (for Codex, its effective CODEX_HOME) and must not fall back\n   * to a driver-global/default account.\n   */\n  readonly consumeRateLimitResetCredit?: (input: {\n    readonly idempotencyKey: string;\n  }) => Effect.Effect<ProviderRateLimitResetCreditOutcome, ProviderDriverError>;\n}\n\n'''
          text = replace_once(
              text,
              "/**\n * One materialized provider instance.",
              account_actions + "/**\n * One materialized provider instance.",
              "ProviderDriver account actions interface",
          )
          text = replace_once(
              text,
              '  readonly textGeneration: TextGeneration.TextGeneration["Service"];\n}',
              '  readonly textGeneration: TextGeneration.TextGeneration["Service"];\n  readonly accountActions?: ProviderAccountActions;\n}',
              "ProviderDriver accountActions field",
          )
          Path(path).write_text(text, encoding="utf-8", newline="\n")

          # CodexDriver.ts: bind the official consumer to the exact materialized instance.
          path = "apps/server/src/provider/Drivers/CodexDriver.ts"
          text = main_file(path)
          text = replace_once(
              text,
              'import { checkCodexProviderStatus, makePendingCodexProvider } from "../Layers/CodexProvider.ts";\n',
              'import { checkCodexProviderStatus, makePendingCodexProvider } from "../Layers/CodexProvider.ts";\nimport { consumeCodexRateLimitResetCredit } from "../Layers/CodexRateLimitResetCredit.ts";\n',
              "CodexDriver reset import",
          )
          consume_closure = '''      const consumeRateLimitResetCredit = (input: { readonly idempotencyKey: string }) =>\n        consumeCodexRateLimitResetCredit({\n          settings: effectiveConfig,\n          environment: processEnv,\n          idempotencyKey: input.idempotencyKey,\n        }).pipe(\n          Effect.provideService(ChildProcessSpawner.ChildProcessSpawner, spawner),\n          Effect.mapError(\n            (cause) =>\n              new ProviderDriverError({\n                driver: DRIVER_KIND,\n                instanceId,\n                detail: `Failed to consume banked rate-limit reset: ${cause.message ?? String(cause)}`,\n                cause,\n              }),\n          ),\n        );\n\n'''
          text = replace_once(
              text,
              "      return {\n        instanceId,\n        driverKind: DRIVER_KIND,",
              consume_closure + "      return {\n        instanceId,\n        driverKind: DRIVER_KIND,",
              "CodexDriver consume closure",
          )
          text = replace_once(
              text,
              "        textGeneration,\n      } satisfies ProviderInstance;",
              "        textGeneration,\n        accountActions: { consumeRateLimitResetCredit },\n      } satisfies ProviderInstance;",
              "CodexDriver accountActions return",
          )
          Path(path).write_text(text, encoding="utf-8", newline="\n")

          # CodexProvider.ts: non-fatal subscription quota probe + display message.
          path = "apps/server/src/provider/Layers/CodexProvider.ts"
          text = main_file(path)
          text = replace_once(
              text,
              'import { codexAppServerArgs, resolveCodexLaunchArgs } from "./codexLaunchArgs.ts";\n',
              'import { codexAppServerArgs, resolveCodexLaunchArgs } from "./codexLaunchArgs.ts";\nimport { formatCodexRateLimitMessage } from "./CodexRateLimits.ts";\n',
              "CodexProvider formatter import",
          )
          text = replace_once(
              text,
              'const CODEX_APP_SERVER_PROBE_FORCE_KILL_AFTER = "2 seconds" as const;\n',
              'const CODEX_APP_SERVER_PROBE_FORCE_KILL_AFTER = "2 seconds" as const;\nconst CODEX_RATE_LIMIT_PROBE_TIMEOUT = Duration.seconds(3);\n',
              "CodexProvider quota timeout",
          )
          text = replace_once(
              text,
              "  readonly skills: ReadonlyArray<ServerProviderSkill>;\n}",
              "  readonly skills: ReadonlyArray<ServerProviderSkill>;\n  readonly rateLimits?: CodexSchema.V2GetAccountRateLimitsResponse[\"rateLimits\"] | null;\n  readonly rateLimitResetCredits?:\n    | CodexSchema.V2GetAccountRateLimitsResponse[\"rateLimitResetCredits\"]\n    | null;\n}",
              "CodexProvider snapshot quota fields",
          )
          text = replace_once(
              text,
              "      models: appendCustomCodexModels([], input.customModels ?? []),\n      skills: [],\n    } satisfies CodexAppServerProviderSnapshot;",
              "      models: appendCustomCodexModels([], input.customModels ?? []),\n      skills: [],\n      rateLimits: null,\n      rateLimitResetCredits: null,\n    } satisfies CodexAppServerProviderSnapshot;",
              "CodexProvider unauth quota fields",
          )
          rate_request = '''\n  const rateLimitsRequest =\n    accountResponse.account?.type === "chatgpt"\n      ? client.request("account/rateLimits/read", undefined).pipe(\n          Effect.timeoutOption(CODEX_RATE_LIMIT_PROBE_TIMEOUT),\n          Effect.map(Option.getOrNull),\n          Effect.orElseSucceed(() => null),\n        )\n      : Effect.succeed(null);\n'''
          text = replace_once(
              text,
              "\n  const [skillsResponse, models] = yield* Effect.all(\n",
              rate_request + "\n  const [skillsResponse, models, rateLimitsResponse] = yield* Effect.all(\n",
              "CodexProvider quota request insertion",
          )
          text = replace_once(
              text,
              '      requestAllCodexModels(client),\n    ],\n    { concurrency: "unbounded" },\n  );',
              '      requestAllCodexModels(client),\n      rateLimitsRequest,\n    ],\n    { concurrency: "unbounded" },\n  );',
              "CodexProvider quota concurrency",
          )
          text = replace_once(
              text,
              "    skills: parseCodexSkillsListResponse(skillsResponse, input.cwd),\n  } satisfies CodexAppServerProviderSnapshot;",
              "    skills: parseCodexSkillsListResponse(skillsResponse, input.cwd),\n    rateLimits: rateLimitsResponse?.rateLimits ?? null,\n    rateLimitResetCredits: rateLimitsResponse?.rateLimitResetCredits ?? null,\n  } satisfies CodexAppServerProviderSnapshot;",
              "CodexProvider quota snapshot result",
          )
          text = replace_once(
              text,
              "  const snapshot = probeResult.success.value;\n  const accountStatus = accountProbeStatus(snapshot.account);\n\n  return buildServerProvider({",
              "  const snapshot = probeResult.success.value;\n  const accountStatus = accountProbeStatus(snapshot.account);\n  const rateLimitMessage = formatCodexRateLimitMessage(\n    snapshot.rateLimits,\n    undefined,\n    snapshot.rateLimitResetCredits,\n  );\n  const providerMessage = accountStatus.message ?? rateLimitMessage;\n\n  return buildServerProvider({",
              "CodexProvider formatted message",
          )
          text = replace_once(
              text,
              "      ...(accountStatus.message ? { message: accountStatus.message } : {}),",
              "      ...(providerMessage ? { message: providerMessage } : {}),",
              "CodexProvider message selection",
          )
          Path(path).write_text(text, encoding="utf-8", newline="\n")

          # The workflow is one-shot; remove it from the commit it produces.
          Path(".github/workflows/t3-quota-surgical-cleanup.yml").unlink()

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - name: Focused quota/reset tests
        run: |
          vp test run apps/server/src/provider/Layers/CodexRateLimits.test.ts apps/server/src/provider/consumeRateLimitResetCredit.test.ts
          vp test run apps/web/src/components/sidebar/SidebarCodexLimitsPopover.logic.test.ts
      - name: Typecheck
        run: vpr typecheck
      - name: Commit surgical cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "refactor(codex): minimize quota reset integration diff"
          git push origin HEAD:feat/codex-quota-dashboard
