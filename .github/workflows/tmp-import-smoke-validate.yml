name: Validate importer smoke fixes

on:
  push:
    branches:
      - feat/codex-thread-import
    paths:
      - .github/workflows/tmp-import-smoke-validate.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Apply guarded smoke fixes
        run: |
          set -euo pipefail
          python scripts/tmp-import-smoke-fixes.py
          python scripts/tmp-import-provider-lock-fix.py

      - name: Apply repository formatting
        run: vp check --fix

      - name: Repository conformance
        run: vp check

      - name: Typecheck
        run: vpr typecheck

      - name: Server tests
        run: vp run --filter t3 test

      - name: Web tests
        run: vp run --filter @t3tools/web test

      - name: Diff sanity
        run: |
          set -euo pipefail
          git diff --check
          git status --short

      - name: Create validated Git blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files=(
            apps/server/src/threadImport/ThreadImportService.ts
            apps/server/src/threadImport/ThreadImportService.test.ts
            apps/server/src/orchestration/decider.ts
            apps/server/src/orchestration/decider.threadImport.test.ts
            apps/web/src/components/ChatView.logic.ts
            apps/web/src/components/ChatView.logic.test.ts
            apps/web/src/components/ChatView.tsx
          )
          : > /tmp/blob-shas.txt
          for file in "${files[@]}"; do
            payload="$(base64 -w0 "$file")"
            sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/blobs" --method POST -f content="$payload" -f encoding=base64 --jq .sha)"
            printf '%s\t%s\n' "$sha" "$file" >> /tmp/blob-shas.txt
          done
          cat /tmp/blob-shas.txt

      - name: Upload blob manifest
        uses: actions/upload-artifact@v7
        with:
          name: importer-smoke-fix-blobs
          path: /tmp/blob-shas.txt
          retention-days: 1
