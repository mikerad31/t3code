name: Diagnose import continuation typecheck

on:
  push:
    branches:
      - fix/import-continuation-health-shared-history

permissions:
  contents: read

jobs:
  typecheck-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Reproduce guarded product patch
        shell: bash
        run: |
          awk '
            /- name: Apply guarded importer hardening patch/ { wanted=1; next }
            wanted && /run: \|/ { capture=1; next }
            capture && /^      - name:/ { exit }
            capture {
              sub(/^          /, "")
              print
            }
          ' .github/workflows/patch-import-continuation-health.yml > /tmp/apply-import-patch.sh
          bash /tmp/apply-import-patch.sh
          vp fmt

      - name: Capture monorepo typecheck
        id: typecheck
        shell: bash
        run: |
          set +e
          vp run typecheck 2>&1 | tee /tmp/typecheck.log
          code=${PIPESTATUS[0]}
          echo "$code" > /tmp/typecheck.exit
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload typecheck diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: import-continuation-typecheck
          path: |
            /tmp/typecheck.log
            /tmp/typecheck.exit
          if-no-files-found: error
          retention-days: 3

      - name: Gate typecheck result
        run: test "${{ steps.typecheck.outputs.exit_code }}" -eq 0
