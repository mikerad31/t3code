name: T3 importer resume repair

on:
  push:
    branches:
      - feat/codex-thread-import
    paths:
      - .github/workflows/t3-import-resume-repair.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Apply guarded resume repair patch
        run: python .github/scripts/t3_import_resume_repair.py
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - name: Server typecheck
        working-directory: apps/server
        run: vp run typecheck
      - name: Importer service tests
        run: vp test run apps/server/src/threadImport/ThreadImportService.test.ts
      - name: Web typecheck
        working-directory: apps/web
        run: vp run typecheck
      - name: Diff check
        run: git diff --check
      - name: Commit resume repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/server/src/threadImport/ThreadImportService.ts apps/server/src/threadImport/ThreadImportService.test.ts
          git diff --cached --check
          git commit -m "fix(import): repair missing Codex resume bindings"
          git push origin HEAD:feat/codex-thread-import
