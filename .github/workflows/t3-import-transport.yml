name: T3 importer transport wiring

on:
  push:
    branches: [feat/codex-thread-import]
    paths: [.github/workflows/t3-import-transport.yml]

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Wire importer contracts auth server client and tests
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path_str: str, old: str, new: str, label: str) -> None:
              path = Path(path_str)
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label} anchor mismatch in {path_str}: {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          # contracts/rpc.ts: schemas + method names + RPC definitions + group membership.
          replace_once(
              "packages/contracts/src/rpc.ts",
              '''import { ProviderInstanceId } from "./providerInstance.ts";''',
              '''import { ProviderInstanceId } from "./providerInstance.ts";
import {
  ThreadImportCommitInput,
  ThreadImportCommitResult,
  ThreadImportError,
  ThreadImportScanInput,
  ThreadImportScanResult,
} from "./threadImports.ts";''',
              "thread import contract import",
          )
          replace_once(
              "packages/contracts/src/rpc.ts",
              '''  // Provider methods
  providerUploadFeedback: "provider.uploadFeedback",

  // VCS methods''',
              '''  // Provider methods
  providerUploadFeedback: "provider.uploadFeedback",

  // Thread import methods
  threadImportsScan: "threadImports.scan",
  threadImportsCommit: "threadImports.commit",

  // VCS methods''',
              "thread import WS method names",
          )
          replace_once(
              "packages/contracts/src/rpc.ts",
              '''export const WsProviderUploadFeedbackRpc = Rpc.make(WS_METHODS.providerUploadFeedback, {
  payload: ProviderUploadFeedbackInput,
  success: ProviderUploadFeedbackResult,
  error: Schema.Union([ProviderUploadFeedbackError, EnvironmentAuthorizationError]),
});

export const WsSubscribeVcsStatusRpc''',
              '''export const WsProviderUploadFeedbackRpc = Rpc.make(WS_METHODS.providerUploadFeedback, {
  payload: ProviderUploadFeedbackInput,
  success: ProviderUploadFeedbackResult,
  error: Schema.Union([ProviderUploadFeedbackError, EnvironmentAuthorizationError]),
});

export const WsThreadImportsScanRpc = Rpc.make(WS_METHODS.threadImportsScan, {
  payload: ThreadImportScanInput,
  success: ThreadImportScanResult,
  error: Schema.Union([ThreadImportError, EnvironmentAuthorizationError]),
});

export const WsThreadImportsCommitRpc = Rpc.make(WS_METHODS.threadImportsCommit, {
  payload: ThreadImportCommitInput,
  success: ThreadImportCommitResult,
  error: Schema.Union([ThreadImportError, EnvironmentAuthorizationError]),
});

export const WsSubscribeVcsStatusRpc''',
              "thread import RPC definitions",
          )
          replace_once(
              "packages/contracts/src/rpc.ts",
              '''  WsAttachmentsDeleteRpc,
  WsProviderUploadFeedbackRpc,
  WsSubscribeVcsStatusRpc,''',
              '''  WsAttachmentsDeleteRpc,
  WsProviderUploadFeedbackRpc,
  WsThreadImportsScanRpc,
  WsThreadImportsCommitRpc,
  WsSubscribeVcsStatusRpc,''',
              "thread import RPC group",
          )

          # Exhaustive authorization table: scans are read-only; commits create T3 history.
          replace_once(
              "apps/server/src/auth/RpcAuthorization.ts",
              '''  [WS_METHODS.providerUploadFeedback]: AuthOrchestrationOperateScope,
  [WS_METHODS.subscribeVcsStatus]: AuthOrchestrationReadScope,''',
              '''  [WS_METHODS.providerUploadFeedback]: AuthOrchestrationOperateScope,
  [WS_METHODS.threadImportsScan]: AuthOrchestrationReadScope,
  [WS_METHODS.threadImportsCommit]: AuthOrchestrationOperateScope,
  [WS_METHODS.subscribeVcsStatus]: AuthOrchestrationReadScope,''',
              "thread import authorization",
          )

          # Server: construct one import service from the same authoritative registries/read model.
          replace_once(
              "apps/server/src/ws.ts",
              '''import * as ProviderRegistry from "./provider/Services/ProviderRegistry.ts";
import * as ProviderService from "./provider/Services/ProviderService.ts";''',
              '''import * as ProviderInstanceRegistry from "./provider/Services/ProviderInstanceRegistry.ts";
import * as ProviderRegistry from "./provider/Services/ProviderRegistry.ts";
import * as ProviderService from "./provider/Services/ProviderService.ts";
import * as ProviderSessionDirectory from "./provider/Services/ProviderSessionDirectory.ts";
import { makeThreadImportService } from "./threadImport/ThreadImportService.ts";''',
              "thread import server imports",
          )
          replace_once(
              "apps/server/src/ws.ts",
              '''      const providerRegistry = yield* ProviderRegistry.ProviderRegistry;
      const providerService = yield* ProviderService.ProviderService;
      const providerMaintenanceRunner = yield* ProviderMaintenanceRunner.ProviderMaintenanceRunner;''',
              '''      const providerInstances = yield* ProviderInstanceRegistry.ProviderInstanceRegistry;
      const providerRegistry = yield* ProviderRegistry.ProviderRegistry;
      const providerService = yield* ProviderService.ProviderService;
      const providerSessions = yield* ProviderSessionDirectory.ProviderSessionDirectory;
      const threadImports = makeThreadImportService({
        projection: projectionSnapshotQuery,
        engine: orchestrationEngine,
        providerInstances,
        providerSessions,
      });
      const providerMaintenanceRunner = yield* ProviderMaintenanceRunner.ProviderMaintenanceRunner;''',
              "thread import server service construction",
          )
          replace_once(
              "apps/server/src/ws.ts",
              '''        [WS_METHODS.providerUploadFeedback]: (input) =>
          observeRpcEffect(
            WS_METHODS.providerUploadFeedback,
            providerService.uploadFeedback(input).pipe(
              Effect.mapError(
                (cause) =>
                  new ProviderUploadFeedbackError({
                    threadId: input.threadId,
                    cause,
                  }),
              ),
            ),
            { "rpc.aggregate": "provider" },
          ),
        [WS_METHODS.serverUpdateProvider]:''',
              '''        [WS_METHODS.providerUploadFeedback]: (input) =>
          observeRpcEffect(
            WS_METHODS.providerUploadFeedback,
            providerService.uploadFeedback(input).pipe(
              Effect.mapError(
                (cause) =>
                  new ProviderUploadFeedbackError({
                    threadId: input.threadId,
                    cause,
                  }),
              ),
            ),
            { "rpc.aggregate": "provider" },
          ),
        [WS_METHODS.threadImportsScan]: (input) =>
          observeRpcEffect(WS_METHODS.threadImportsScan, threadImports.scan(input), {
            "rpc.aggregate": "thread-import",
          }),
        [WS_METHODS.threadImportsCommit]: (input) =>
          observeRpcEffect(WS_METHODS.threadImportsCommit, threadImports.commit(input), {
            "rpc.aggregate": "thread-import",
          }),
        [WS_METHODS.serverUpdateProvider]:''',
              "thread import server handlers",
          )

          # Client runtime: cache scans briefly; serialize commits per environment.
          replace_once(
              "packages/client-runtime/src/state/server.ts",
              '''    usageSummary: createEnvironmentRpcQueryAtomFamily(runtime, {
      label: "environment-data:server:usage-summary",
      tag: WS_METHODS.serverGetUsageSummary,
      staleTimeMs: 60_000,
    }),
    configProjection,''',
              '''    usageSummary: createEnvironmentRpcQueryAtomFamily(runtime, {
      label: "environment-data:server:usage-summary",
      tag: WS_METHODS.serverGetUsageSummary,
      staleTimeMs: 60_000,
    }),
    threadImportScan: createEnvironmentRpcQueryAtomFamily(runtime, {
      label: "environment-data:server:thread-import-scan",
      tag: WS_METHODS.threadImportsScan,
      staleTimeMs: 30_000,
    }),
    configProjection,''',
              "thread import scan client query",
          )
          replace_once(
              "packages/client-runtime/src/state/server.ts",
              '''    refreshProviders: createEnvironmentRpcCommand(runtime, {
      label: "environment-data:server:refresh-providers",
      tag: WS_METHODS.serverRefreshProviders,
      concurrency: {
        mode: "singleFlight",
        key: ({ environmentId }) => environmentId,
      },
    }),''',
              '''    threadImportCommit: createEnvironmentRpcCommand(runtime, {
      label: "environment-data:server:thread-import-commit",
      tag: WS_METHODS.threadImportsCommit,
      concurrency: {
        mode: "singleFlight",
        key: ({ environmentId }) => environmentId,
      },
    }),
    refreshProviders: createEnvironmentRpcCommand(runtime, {
      label: "environment-data:server:refresh-providers",
      tag: WS_METHODS.serverRefreshProviders,
      concurrency: {
        mode: "singleFlight",
        key: ({ environmentId }) => environmentId,
      },
    }),''',
              "thread import commit client command",
          )

          # Server test harness: the new WS layer legitimately depends on these provider services.
          replace_once(
              "apps/server/src/server.test.ts",
              '''import * as ProviderRegistry from "./provider/Services/ProviderRegistry.ts";
import * as ProviderService from "./provider/Services/ProviderService.ts";''',
              '''import * as ProviderInstanceRegistry from "./provider/Services/ProviderInstanceRegistry.ts";
import * as ProviderRegistry from "./provider/Services/ProviderRegistry.ts";
import * as ProviderService from "./provider/Services/ProviderService.ts";
import * as ProviderSessionDirectory from "./provider/Services/ProviderSessionDirectory.ts";''',
              "server test provider service imports",
          )
          replace_once(
              "apps/server/src/server.test.ts",
              '''    providerRegistry?: Partial<ProviderRegistry.ProviderRegistry["Service"]>;
    providerService?: Partial<ProviderService.ProviderService["Service"]>;''',
              '''    providerInstanceRegistry?: Partial<ProviderInstanceRegistry.ProviderInstanceRegistryShape>;
    providerRegistry?: Partial<ProviderRegistry.ProviderRegistry["Service"]>;
    providerService?: Partial<ProviderService.ProviderService["Service"]>;
    providerSessionDirectory?: Partial<ProviderSessionDirectory.ProviderSessionDirectoryShape>;''',
              "server test provider service options",
          )
          replace_once(
              "apps/server/src/server.test.ts",
              '''        Layer.mergeAll(
          Layer.mock(ProviderRegistry.ProviderRegistry)({''',
              '''        Layer.mergeAll(
          Layer.mock(ProviderInstanceRegistry.ProviderInstanceRegistry)({
            getInstance: () => Effect.succeed(undefined),
            listInstances: Effect.succeed([]),
            listUnavailable: Effect.succeed([]),
            streamChanges: Stream.empty,
            subscribeChanges: Effect.die(
              "ProviderInstanceRegistry subscription is not stubbed in this test",
            ),
            ...options?.layers?.providerInstanceRegistry,
          }),
          Layer.mock(ProviderSessionDirectory.ProviderSessionDirectory)({
            upsert: () => Effect.void,
            getProvider: () => Effect.die("Provider session lookup is not stubbed in this test"),
            getBinding: () => Effect.succeed(Option.none()),
            listThreadIds: () => Effect.succeed([]),
            listBindings: () => Effect.succeed([]),
            ...options?.layers?.providerSessionDirectory,
          }),
          Layer.mock(ProviderRegistry.ProviderRegistry)({''',
              "server test provider service layers",
          )

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - name: Full repository typecheck
        run: vpr typecheck
      - name: Server RPC seam tests
        run: vp test run apps/server/src/server.test.ts
      - name: Commit importer transport
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/contracts/src/rpc.ts apps/server/src/auth/RpcAuthorization.ts apps/server/src/ws.ts packages/client-runtime/src/state/server.ts apps/server/src/server.test.ts
          git commit -m "feat(import): expose Codex thread import over RPC"
          git push origin HEAD:feat/codex-thread-import
