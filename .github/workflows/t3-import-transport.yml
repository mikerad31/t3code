name: T3 importer transport wiring

on:
  push:
    branches:
      - feat/codex-thread-import
    paths:
      - .github/workflows/t3-import-transport.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Apply guarded transport patch
        run: python .github/scripts/t3_import_transport.py
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - name: Full repository typecheck
        run: vpr typecheck
      - name: Server RPC seam tests
        run: vp test run apps/server/src/server.test.ts
      - name: Commit importer transport
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/contracts/src/rpc.ts apps/server/src/auth/RpcAuthorization.ts apps/server/src/ws.ts packages/client-runtime/src/state/server.ts apps/server/src/server.test.ts
          git commit -m "feat(import): expose Codex thread import over RPC"
          git push origin HEAD:feat/codex-thread-import
