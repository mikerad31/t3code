name: Validate final integrated stack restack v3

on:
  push:
    branches:
      - validate/final-integrated-stack-restack-v3

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.1
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Assert exact integrated product surface
        run: |
          git fetch origin main
          cat > /tmp/expected.txt <<'EOF'
          apps/server/src/auth/RpcAuthorization.ts
          apps/server/src/orchestration/Layers/ProviderCommandReactor.test.ts
          apps/server/src/orchestration/Layers/ProviderCommandReactor.ts
          apps/server/src/provider/Drivers/CodexDriver.ts
          apps/server/src/provider/Drivers/CodexHomeLayout.sidecar.test.ts
          apps/server/src/provider/Drivers/CodexHomeLayout.ts
          apps/server/src/provider/Layers/CodexProvider.ts
          apps/server/src/provider/Layers/CodexRateLimitResetCredit.ts
          apps/server/src/provider/Layers/CodexRateLimits.test.ts
          apps/server/src/provider/Layers/CodexRateLimits.ts
          apps/server/src/provider/Layers/ProviderSessionDirectory.instanceSwitch.test.ts
          apps/server/src/provider/Layers/ProviderSessionDirectory.ts
          apps/server/src/provider/ProviderDriver.ts
          apps/server/src/provider/consumeRateLimitResetCredit.test.ts
          apps/server/src/provider/consumeRateLimitResetCredit.ts
          apps/server/src/server.test.ts
          apps/server/src/ws.ts
          apps/web/src/components/Sidebar.logic.test.ts
          apps/web/src/components/Sidebar.logic.ts
          apps/web/src/components/Sidebar.tsx
          apps/web/src/components/chat/MessagesTimeline.tsx
          apps/web/src/components/sidebar/SidebarChrome.tsx
          apps/web/src/components/sidebar/SidebarCodexLimitsPopover.logic.test.ts
          apps/web/src/components/sidebar/SidebarCodexLimitsPopover.logic.ts
          apps/web/src/components/sidebar/SidebarCodexLimitsPopover.tsx
          apps/web/src/components/threadActionMenu.logic.test.ts
          apps/web/src/components/threadActionMenu.logic.ts
          apps/web/src/hooks/useThreadActionMenu.ts
          apps/web/src/providerInstances.test.ts
          apps/web/src/providerInstances.ts
          apps/web/src/state/threads.ts
          apps/web/src/threadExport.logic.test.ts
          apps/web/src/threadExport.logic.ts
          apps/web/src/threadInspection.ts
          apps/web/src/threadInspectionBus.test.ts
          apps/web/src/threadInspectionBus.ts
          packages/client-runtime/src/state/server.ts
          packages/contracts/src/provider.ts
          packages/contracts/src/rpc.ts
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          git diff --name-only origin/main...HEAD \
            | grep -v '^.github/workflows/tmp-validate-final-integrated-stack-restack-v3.yml$' \
            | sort > /tmp/actual.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Repository conformance
        run: pnpm exec vp check

      - name: Focused cross-feature regressions
        run: |
          pnpm --filter t3 exec vp test run \
            src/threadImport/ThreadImportService.test.ts \
            src/orchestration/Layers/ProviderCommandReactor.test.ts \
            src/provider/Drivers/CodexHomeLayout.sidecar.test.ts \
            src/provider/Layers/ProviderSessionDirectory.instanceSwitch.test.ts \
            src/provider/Layers/CodexRateLimits.test.ts \
            src/provider/consumeRateLimitResetCredit.test.ts
          pnpm --filter @t3tools/web exec vp test run \
            src/components/ChatView.logic.test.ts \
            src/components/Sidebar.logic.test.ts \
            src/components/sidebar/SidebarCodexLimitsPopover.logic.test.ts \
            src/components/threadActionMenu.logic.test.ts \
            src/threadExport.logic.test.ts \
            src/threadInspectionBus.test.ts \
            src/providerInstances.test.ts

      - name: Full web regression suite
        run: pnpm --filter @t3tools/web exec vp test run

      - name: Full server regression suite
        run: pnpm --filter t3 test

      - name: Full monorepo typecheck
        run: pnpm typecheck

      - name: Final diff sanity
        run: |
          git diff --check origin/main...HEAD
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --name-only origin/main...HEAD \
            | grep -v '^.github/workflows/tmp-validate-final-integrated-stack-restack-v3.yml$' \
            | sort > /tmp/actual-final.txt
          diff -u /tmp/expected.txt /tmp/actual-final.txt
