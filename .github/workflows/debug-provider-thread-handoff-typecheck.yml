name: Debug provider thread handoff typecheck

on:
  push:
    branches:
      - validate/provider-thread-handoff-v2
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Repair validator patcher tail matchers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("scripts/patch-provider-thread-handoff-v1.py")
          text = p.read_text(encoding="utf-8")
          old_needle = "needle = '''      ).pipe(\\n"
          new_needle = "needle = '''      }).pipe(\\n"
          old_replacement = "replacement = '''      ).pipe(\\n"
          new_replacement = "replacement = '''      }).pipe(\\n"
          if text.count(old_needle) != 1 or text.count(old_replacement) != 1:
              raise SystemExit("expected startSession tail matcher literals not found exactly once")
          text = text.replace(old_needle, new_needle, 1)
          text = text.replace(old_replacement, new_replacement, 1)
          p.write_text(text, encoding="utf-8")
          PY

      - name: Apply validator product patches
        run: |
          python3 scripts/patch-provider-thread-handoff-v1.py
          python3 scripts/repair-provider-handoff-semaphore-v1.py
          python3 scripts/patch-provider-thread-handoff-v2.py
          python3 scripts/patch-provider-thread-handoff-v2-reactor-test.py
          vp fmt

      - name: Capture typecheck
        id: typecheck
        run: |
          set +e
          vp run typecheck > /tmp/typecheck.log 2>&1
          status=$?
          cat /tmp/typecheck.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload typecheck log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: provider-handoff-typecheck-debug
          path: /tmp/typecheck.log
          if-no-files-found: error
          retention-days: 1

      - name: Gate typecheck
        run: test "${{ steps.typecheck.outputs.status }}" = "0"
